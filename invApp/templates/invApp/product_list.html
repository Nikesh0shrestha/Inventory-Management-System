<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
</head>
<body>
    <h1>Product List</h1>

    <!-- Create Product Button -->
    <p><a href="{% url 'product_create' %}">Create New Product</a></p>

    <!-- Product Table -->
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
                <tr>
                    <td>{{ product.id }}</td>
                    <td>{{ product.name }}</td>
                    <td>{{ product.price }}</td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">No products available.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
