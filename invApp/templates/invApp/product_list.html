<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
</head>
<body>
    <h1>Product List</h1>

    <!-- Create Product Button -->
    <p><a href="{% url 'product_create' %}">Create New Product</a></p>

    <!-- Product Table -->
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for product in products %}
                <tr>
                    <td>{{ product.product_id }}</td>
                    <td>{{ product.name }}</td>
                    <td>{{ product.price }}</td>
                    <td>

                        <a href="{% url 'product_update' product.product_id %}">Update</a>

                        <!-- Delete Button -->
                        <form method="post" action="{% url 'product_delete' product.product_id %}" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" onclick="return confirm('Are you sure you want to delete this product?');">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
            {% empty %}
                <tr>
                    <td colspan="4">No products available.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
